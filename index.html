function risshunDay(year){
  // 1900〜2050向けの二十四節気略算式（立春）
  const y=year-1;
  return Math.floor(4.8693 + 0.242713*(y-1900) - Math.floor((y-1900)/4));
}
function starNumberForYear(year){
  let s=String(year).split("").reduce((a,b)=>a+Number(b),0);
  while(s>9) s=String(s).split("").reduce((a,b)=>a+Number(b),0);
  let n=11-s;
  while(n>9)n-=9;
  while(n<1)n+=9;
  return n;
}
function calcStar(dateStr){
  const [y,m,d]=dateStr.split("-").map(Number);
  const rd=risshunDay(y);
  let kyYear=y;
  let boundary=false;
  if(m<2 || (m===2 && d<rd)) kyYear=y-1;
  if(m===2 && d===rd) boundary=true;
  return {n:starNumberForYear(kyYear),kyYear,rd,boundary};
}

  const calc=calcStar(input.value);

  for(const line of lines){document.getElementById("stageText").textContent=line;await sleep(650)}
  stage.style.display="none";
  render(calc);
}

function wrapText(ctx,text,x,y,max,lineH,size){ctx.font=`800 ${size}px sans-serif`;ctx.textAlign="center";let line="",arr=[];for(const ch of text){let t=line+ch;if(ctx.measureText(t).width>max&&line){arr.push(line);line=ch}else line=t}if(line)arr.push(line);arr.slice(0,5).forEach((v,i)=>ctx.fillText(v,x,y+i*lineH));}
